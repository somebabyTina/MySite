<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LINE Bot × Ngrok 運作架構｜互動式流程圖</title>
  <meta name="description" content="透過互動式流程圖，一步一步了解 LINE Bot Webhook 如何經由 Ngrok 將訊息傳送至本機 Localhost。">
  <meta name="author" content="Hsiang">
  <link rel="canonical" href="https://somebabytina.github.io/MySite/Vocus/html/line_bot_ngrok_architecture.html">

  <meta property="og:title" content="LINE Bot × Ngrok 運作架構｜互動式流程圖">
  <meta property="og:description" content="LINE Bot 為什麼需要 Ngrok？用 4 個步驟互動展示 Webhook、Ngrok Tunnel 與 Localhost 的完整訊息傳遞流程。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://somebabytina.github.io/MySite/Vocus/html/line_bot_ngrok_architecture.html">
  <meta property="og:site_name" content="Some Baby">
  <!-- 將分享圖放到下列位置後即可啟用：
  <meta property="og:image" content="https://somebabytina.github.io/MySite/Vocus/images/line_bot_ngrok_preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="LINE Bot、LINE Platform、Ngrok Cloud 與 Localhost 的互動架構流程圖">
  -->

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="LINE Bot × Ngrok 運作架構｜互動式流程圖">
  <meta name="twitter:description" content="用互動動畫理解 LINE Bot Webhook 如何透過 Ngrok 傳送到 Localhost。">

  <style>
    :root{
      --bg:#f8fafc;--card:#fff;--text:#172033;--muted:#657084;--border:#dce3ec;
      --accent:#3186ff;--accent-soft:#e9f3ff;--zone:#f1f5f9;
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#11151b;--card:#191f27;--text:#edf2f7;--muted:#aab4c2;--border:#303947;--accent:#8cc8ff;--accent-soft:#173451;--zone:#151b23}
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
    body{padding:18px}
    .app{max-width:760px;margin:auto}
    header{margin-bottom:14px}
    h1{font-size:21px;line-height:1.35;margin:0 0 5px}
    .sub{font-size:14px;color:var(--muted);margin:0}
    .diagram{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:14px;overflow-x:auto}
    svg{display:block;width:100%;min-width:620px;height:auto}
    .node,.edge,.pill{transition:.25s}
    .edge{opacity:.28}
    .node.active{fill:var(--accent-soft)!important;stroke:var(--accent)!important;stroke-width:2!important}
    .edge.active{opacity:1;stroke:var(--accent)!important;stroke-width:2!important;stroke-dasharray:none!important}
    .pill.active{fill:var(--accent-soft)!important;stroke:var(--accent)!important}
    .info{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px}
    .info-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .badge{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 10px}
    .count{font-size:12px;color:var(--muted)}
    h2{font-size:16px;margin:10px 0 6px}
    #desc{font-size:14px;line-height:1.6;color:var(--muted);margin:0}
    code{background:var(--zone);padding:2px 5px;border-radius:5px}
    .controls{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .buttons{display:flex;gap:8px;flex-wrap:wrap}
    button{min-height:42px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:8px 16px;font-size:14px;cursor:pointer}
    button.primary{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
    button:disabled{opacity:.4;cursor:not-allowed}
    .steps{display:flex;gap:6px}
    .dot{width:26px;height:6px;border:0;padding:0;min-height:0;background:var(--border);border-radius:999px}
    .dot.active{width:36px;background:var(--accent)}
    .packet{transition:none}
    footer{margin-top:12px;font-size:12px;color:var(--muted)}
    @media(max-width:520px){body{padding:12px}h1{font-size:19px}.controls{align-items:flex-start}.buttons{width:100%}.buttons button{flex:1;padding-inline:10px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<main class="app">
  <header>
    <h1>Ngrok 穿透原理與 LINE Webhook 溝通流程</h1>
    <p class="sub">點擊步驟或「自動播放」，觀察封包如何透過 Ngrok Tunnel 傳遞至本機 Port 5000。</p>
  </header>

  <section class="diagram" aria-label="LINE Bot 與 Ngrok 互動架構圖">
    <svg viewBox="0 0 680 350" role="img" aria-labelledby="svgtitle svgdesc">
      <title id="svgtitle">LINE Bot 與 Ngrok Webhook 架構</title>
      <desc id="svgdesc">LINE 使用者經 LINE Platform 與 Ngrok Cloud 將 Webhook 請求轉發至本機服務。</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
          <path d="M2 1 L8 5 L2 9" fill="none" stroke="currentColor" stroke-width="1.5"/>
        </marker>
      </defs>

      <rect x="405" y="205" width="235" height="120" rx="16" fill="var(--zone)" stroke="var(--border)" stroke-dasharray="4 4"/>
      <text x="418" y="226" font-size="12" fill="var(--muted)">NAT / 本地防火牆保護區</text>

      <path id="e1" class="edge" d="M520 250 L520 125" fill="none" stroke="var(--text)" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
      <path id="e2" class="edge" d="M435 80 L315 80" fill="none" stroke="var(--text)" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
      <path id="e3a" class="edge" d="M135 80 L175 80" fill="none" stroke="var(--text)" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
      <path id="e3b" class="edge" d="M305 80 L425 80" fill="none" stroke="var(--text)" stroke-dasharray="3 5" marker-end="url(#arrow)"/>
      <path id="e4" class="edge" d="M500 125 L500 242" fill="none" stroke="var(--text)" stroke-dasharray="3 5" marker-end="url(#arrow)"/>

      <rect id="p1" class="pill" x="530" y="165" width="125" height="24" rx="12" fill="var(--card)" stroke="var(--border)"/>
      <text x="592" y="181" text-anchor="middle" font-size="12" fill="var(--text)">1. 建立 Tunnel</text>
      <rect id="p2" class="pill" x="330" y="38" width="92" height="24" rx="12" fill="var(--card)" stroke="var(--border)"/>
      <text x="376" y="54" text-anchor="middle" font-size="12" fill="var(--text)">2. 設定 Webhook</text>
      <rect id="p3" class="pill" x="330" y="94" width="92" height="24" rx="12" fill="var(--card)" stroke="var(--border)"/>
      <text x="376" y="110" text-anchor="middle" font-size="12" fill="var(--text)">3. HTTPS POST</text>
      <rect id="p4" class="pill" x="395" y="165" width="100" height="24" rx="12" fill="var(--card)" stroke="var(--border)"/>
      <text x="445" y="181" text-anchor="middle" font-size="12" fill="var(--text)">4. 轉發訊息</text>

      <rect id="nUser" class="node" x="20" y="50" width="115" height="60" rx="30" fill="var(--card)" stroke="var(--border)"/>
      <text x="77" y="76" text-anchor="middle" font-size="14" fill="var(--text)">LINE 使用者</text>
      <text x="77" y="94" text-anchor="middle" font-size="11" fill="var(--muted)">App / Client</text>

      <rect id="nLine" class="node" x="175" y="50" width="130" height="60" rx="30" fill="var(--card)" stroke="var(--border)"/>
      <text x="240" y="76" text-anchor="middle" font-size="14" fill="var(--text)">LINE Platform</text>
      <text x="240" y="94" text-anchor="middle" font-size="11" fill="var(--muted)">Webhook Trigger</text>

      <rect id="nNgrok" class="node" x="435" y="50" width="170" height="60" rx="30" fill="var(--card)" stroke="var(--border)"/>
      <text x="520" y="76" text-anchor="middle" font-size="14" fill="var(--text)">Ngrok Cloud</text>
      <text x="520" y="94" text-anchor="middle" font-size="11" fill="var(--muted)">*.ngrok-free.app</text>

      <rect id="nLocal" class="node" x="425" y="250" width="190" height="60" rx="30" fill="var(--card)" stroke="var(--border)"/>
      <text x="520" y="276" text-anchor="middle" font-size="14" fill="var(--text)">Localhost 電腦</text>
      <text x="520" y="294" text-anchor="middle" font-size="11" fill="var(--muted)">Port 5000 (Flask / Node)</text>

      <g id="packet" class="packet" opacity="0">
        <rect x="-34" y="-12" width="68" height="24" rx="12" fill="var(--accent)"/>
        <text id="packetText" x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">DATA</text>
      </g>
    </svg>
  </section>

  <section class="info" aria-live="polite">
    <div class="info-top"><span id="badge" class="badge"></span><span id="count" class="count"></span></div>
    <h2 id="stepTitle"></h2>
    <p id="desc"></p>
  </section>

  <nav class="controls" aria-label="流程控制">
    <div class="buttons">
      <button id="prev" type="button">上一步</button>
      <button id="next" type="button">下一步</button>
      <button id="play" class="primary" type="button">自動播放</button>
    </div>
    <div class="steps" aria-label="直接選擇步驟">
      <button class="dot" data-step="0" aria-label="步驟 1"></button>
      <button class="dot" data-step="1" aria-label="步驟 2"></button>
      <button class="dot" data-step="2" aria-label="步驟 3"></button>
      <button class="dot" data-step="3" aria-label="步驟 4"></button>
    </div>
  </nav>

  <footer>Interactive architecture by Hsiang · GitHub Pages</footer>
</main>

<script>
const STEPS=[
 {badge:"STEP 1：連線建立",title:"本機主動連線至 Ngrok 建立隧道",desc:"本地開發者於 CLI 啟動 <code>ngrok http 5000</code>。本機主動向 Ngrok Cloud 建立安全的 Outbound Tunnel，因此不需要讓外部網路直接連入本機。",nodes:["nLocal","nNgrok"],edges:["e1"],pills:["p1"],points:[[520,250],[520,125]],packet:"TUNNEL"},
 {badge:"STEP 2：網址配發",title:"Ngrok 配發 HTTPS 網址並設定 LINE Webhook",desc:"Ngrok 提供公開 HTTPS 網址，例如 <code>https://xxxx.ngrok-free.app</code>。開發者將 Webhook endpoint 設定至 LINE Developers Console。",nodes:["nNgrok","nLine"],edges:["e2"],pills:["p2"],points:[[435,80],[305,80]],packet:"URL"},
 {badge:"STEP 3：Webhook 觸發",title:"LINE Platform 將訊息送往 Ngrok",desc:"LINE 使用者傳送訊息後，LINE Platform 觸發 Webhook，透過 HTTPS POST 將事件 JSON 傳送到 Ngrok 的公開網址。",nodes:["nUser","nLine","nNgrok"],edges:["e3a","e3b"],pills:["p3"],points:[[77,80],[240,80],[520,80]],packet:"POST"},
 {badge:"STEP 4：隧道轉發",title:"Ngrok 將 Webhook 轉發至 Localhost:5000",desc:"Ngrok 收到 LINE 的 Webhook 後，沿著已建立的 Tunnel 將請求轉發至本機 <code>localhost:5000</code>，讓本機 Flask / Node 服務接收事件。",nodes:["nNgrok","nLocal"],edges:["e4"],pills:["p4"],points:[[500,125],[500,250]],packet:"JSON"}
];
let idx=0,playing=false,timer=null,raf=null;
const $=id=>document.getElementById(id);
const dots=[...document.querySelectorAll(".dot")];

function clearState(){
 document.querySelectorAll(".node,.edge,.pill").forEach(x=>x.classList.remove("active"));
}
function render(){
 const s=STEPS[idx]; clearState();
 s.nodes.forEach(id=>$(id).classList.add("active"));
 s.edges.forEach(id=>$(id).classList.add("active"));
 s.pills.forEach(id=>$(id).classList.add("active"));
 $("badge").textContent=s.badge;$("count").textContent=`${idx+1} / ${STEPS.length}`;
 $("stepTitle").textContent=s.title;$("desc").innerHTML=s.desc;
 $("prev").disabled=idx===0;$("next").disabled=idx===STEPS.length-1;
 dots.forEach((d,i)=>d.classList.toggle("active",i===idx));
 animatePacket(s);
}
function animatePacket(s){
 if(raf) cancelAnimationFrame(raf);
 const packet=$("packet"),label=$("packetText"),pts=s.points;
 label.textContent=s.packet;packet.setAttribute("opacity","1");
 const seg=[],lens=[];let total=0;
 for(let i=0;i<pts.length-1;i++){const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);lens.push(l);total+=l;}
 const start=performance.now(),duration=1200;
 function frame(now){
  let t=Math.min((now-start)/duration,1),dist=t*total,acc=0,x=pts[0][0],y=pts[0][1];
  for(let i=0;i<lens.length;i++){if(dist<=acc+lens[i]){const f=(dist-acc)/lens[i];x=pts[i][0]+(pts[i+1][0]-pts[i][0])*f;y=pts[i][1]+(pts[i+1][1]-pts[i][1])*f;break}acc+=lens[i]}
  packet.setAttribute("transform",`translate(${x} ${y})`);
  if(t<1) raf=requestAnimationFrame(frame);
 }
 raf=requestAnimationFrame(frame);
}
function stop(){playing=false;clearInterval(timer);timer=null;$("play").textContent="自動播放";}
$("prev").addEventListener("click",()=>{stop();idx=Math.max(0,idx-1);render()});
$("next").addEventListener("click",()=>{stop();idx=Math.min(STEPS.length-1,idx+1);render()});
$("play").addEventListener("click",()=>{
 if(playing){stop();return}
 playing=true;$("play").textContent="暫停播放";
 timer=setInterval(()=>{idx=(idx+1)%STEPS.length;render()},2200);
});
dots.forEach(d=>d.addEventListener("click",()=>{stop();idx=Number(d.dataset.step);render()}));
render();
</script>
</body>
</html>
